<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Title</title>
        <link rel="stylesheet" href="index.css">
    </head>
    <body>
        <div class="container">
            <div class = "title">
               <h3>도서관리 Form</h3>
            </div>
                
            <fieldset class = "form">
                <form action = "/users" method="post">
                    <label>id:</label>
                    <input type = "text" id="id" placeholder="id를 입력" required><br>


                    <label>title:</label>
                    <input type = "text" id="name" placeholder="도서명을 입력" required><br>

                    <label>author:</label>
                    <input type = "text" id="author" placeholder="작가를 입력" required><br>

                    <label>price:</label>
                    <input type = "text" id="price" placeholder="가격을 입력" required><br>
                    
                    <label>category:</label>
                    <select>
                        <option>소설</option>
                        <option>시</option>
                        <option>잡지</option>
                    </select><br>
                    
                    <button class = "btn">추가</button>
                </form>
            </fieldset>
            
            <table class = "book-table">
                <thead>
                    <tr>
                        <th>ID</th><th>제목</th><th>저자</th><th>카테고리</th><th>가격</th><th>관리</th>
                    </tr>
                </thead>
                <tbody class="book-list"></tbody>
            </table>
        </div>
        <script src = "index.js"></script>
    </body>
</html>
